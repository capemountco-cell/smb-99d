[package]
name = "banker"
description = "The Tauri shell: window, IPC commands, bundling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "banker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
banker-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# protocol-asset: previews read the exact files the user opens (see `preview`).
tauri = { version = "2", features = ["protocol-asset"] }
# The "Save to" location is chosen in a standard macOS folder picker.
tauri-plugin-dialog = "2"

[features]
# Turned on by `tauri build`. Serves the bundled frontend instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]
