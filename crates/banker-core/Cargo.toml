[package]
name = "banker-core"
description = "The app's logic. No Tauri, no UI: builds and tests on any OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Findings cross the IPC boundary as JSON, so the types derive Serialize here
# rather than being mirrored by hand in the Tauri crate.
serde = { workspace = true }

[dev-dependencies]
# Only to check the JSON the UI receives.
serde_json = { workspace = true }
